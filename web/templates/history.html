{{define "historyBody"}}
<div x-data="historyList()" x-init="load()">
    <!-- Stats -->
    <div class="grid-4" style="margin-bottom:24px;">
        <div class="card stat-card">
            <div class="stat-value" x-text="totalCount" style="color:var(--primary);">0</div>
            <div class="stat-label">总执行次数</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="successCount" style="color:var(--success);">0</div>
            <div class="stat-label">成功</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="failedCount" style="color:var(--failed);">0</div>
            <div class="stat-label">失败</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="avgDuration" style="color:var(--running);">0s</div>
            <div class="stat-label">平均耗时</div>
        </div>
    </div>

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <span style="font-size:14px;color:var(--text-secondary);">
                共 <strong x-text="totalCount" style="color:var(--text);">0</strong> 条记录
            </span>
            <input x-model="search" @input="load(1)" placeholder="搜索 Run ID 或项目名..."
                   style="width:200px;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;"
                   @keydown.escape="search=''; load(1)">
            <select x-model="statusFilter" @change="load(1)"
                    style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;outline:none;">
                <option value="">全部状态</option>
                <option value="success">成功</option>
                <option value="failed">失败</option>
                <option value="running">运行中</option>
            </select>
            <select x-model="projectFilter" @change="load(1)"
                    style="padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;outline:none;">
                <option value="">全部项目</option>
                <template x-for="p in projectNames" :key="p">
                    <option :value="p" x-text="p"></option>
                </template>
            </select>
        </div>
        <div class="btn-group">
            <button x-show="selectedIds.length > 0" class="btn btn-sm"
                    style="background:var(--failed);color:#fff;" @click="batchDelete()">
                删除选中 (<span x-text="selectedIds.length"></span>)
            </button>
            <button class="btn btn-ghost btn-sm" @click="load()">刷新</button>
        </div>
    </div>

    <!-- Empty state -->
    <div x-show="runs.length === 0 && !loading" class="card empty">
        <div class="empty-icon">&#9776;</div>
        <p style="font-weight:500;">暂无执行记录</p>
        <p>执行任意项目的任务后，记录将在此显示</p>
    </div>

    <!-- History list -->
    <div x-show="loading" style="text-align:center;padding:40px;color:var(--text-muted);">
        <span class="spinner"></span> 加载中...
    </div>

    <template x-for="(run, idx) in runs" :key="run.id">
        <div class="card fade-in" style="overflow:hidden;"
             :style="'animation-delay:' + (idx * 30) + 'ms'">
            <div style="padding:16px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;"
                 @click="toggle(run.id)">
                <div style="display:flex;align-items:center;gap:12px;flex:1;">
                    <input type="checkbox" :checked="selectedIds.includes(run.id)"
                           @click.stop @change="toggleSelect(run.id)"
                           style="width:16px;height:16px;cursor:pointer;flex-shrink:0;">
                    <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;"
                         :style="statusIconStyle(run.status)">
                        <span x-show="run.status === 'success'" style="color:var(--success);">&#10003;</span>
                        <span x-show="run.status === 'failed'" style="color:var(--failed);">&#10007;</span>
                        <span x-show="run.status === 'running'" class="spinner"></span>
                        <span x-show="!['success','failed','running'].includes(run.status)" style="color:var(--text-muted);">&#9679;</span>
                    </div>
                    <div style="flex:1;">
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px;">
                            <span style="font-weight:600;font-size:14px;" x-text="run.project_name"></span>
                            <span style="font-size:12px;color:var(--text-muted);" x-text="run.workflow_name"></span>
                        </div>
                        <div style="font-size:12px;color:var(--text-muted);display:flex;gap:16px;">
                            <span x-text="'Run ID: ' + run.id.substring(0, 12) + '...'"></span>
                            <span x-text="fmtTime(run.created_at)"></span>
                            <span x-show="run.finished_at" x-text="'耗时: ' + calcDuration(run.created_at, run.finished_at)"></span>
                        </div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <span class="badge" :class="statusBadge(run.status)" x-text="statusLabel(run.status)"></span>
                    <span style="color:var(--text-muted);font-size:12px;" x-text="expanded === run.id ? '收起' : '展开'"></span>
                </div>
            </div>

            <div x-show="expanded === run.id"
                 style="border-top:1px solid var(--border);background:#F8FAFC;"
                 x-data="{ detail: null }"
                 x-init="loadDetail(run.id).then(d => { detail = d; })">
                <div x-show="!detail" style="padding:24px;text-align:center;color:var(--text-muted);">
                    <span class="spinner"></span> 加载中...
                </div>
                <div x-show="detail && detail.steps && detail.steps.length > 0" style="padding:16px 20px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                        <span style="font-size:13px;font-weight:600;color:var(--text-secondary);">步骤详情</span>
                        <div style="display:flex;gap:6px;">
                            <a :href="'/history/' + run.id" class="btn btn-outline btn-xs">查看详情</a>
                            <button class="btn btn-ghost btn-xs" @click.stop="deleteSingle(run.id)">删除</button>
                        </div>
                    </div>
                    <table>
                        <thead><tr><th>步骤</th><th>状态</th><th>Target</th><th>耗时</th></tr></thead>
                        <tbody>
                            <template x-for="s in detail.steps" :key="s.step_name">
                                <tr>
                                    <td style="font-weight:500;" x-text="s.step_name"></td>
                                    <td><span class="badge" :class="'badge-' + s.state" x-text="s.state"></span></td>
                                    <td x-text="s.target || '-'" style="color:var(--text-muted);"></td>
                                    <td x-text="s.duration ? (s.duration || 0).toFixed(1) + 's' : '-'" style="color:var(--text-muted);"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div x-show="detail && (!detail.steps || detail.steps.length === 0)" style="padding:24px;text-align:center;color:var(--text-muted);">
                    暂无步骤信息
                </div>
                <div x-show="detail && detail.logs && detail.logs.length > 0" style="padding:0 20px 16px;">
                    <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-secondary);">
                        执行日志 <span style="font-weight:400;color:var(--text-muted);" x-text="'(最后 ' + Math.min(30, detail.logs.length) + ' 行)'"></span>
                    </div>
                    <div class="log-panel" style="max-height:200px;">
                        <template x-for="log in detail.logs.slice(-30)" :key="log.timestamp + log.message">
                            <div>
                                <span class="log-time" x-text="log.timestamp"></span>
                                <span class="log-step" style="margin-left:8px;" x-text="'[' + log.step_name + ']'"></span>
                                <span class="log-msg" style="margin-left:8px;" x-text="log.message"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Pagination -->
    <div x-show="totalPages > 1" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:20px;">
        <button class="btn btn-ghost btn-xs" @click="load(1)" :disabled="page===1">首页</button>
        <button class="btn btn-ghost btn-xs" @click="load(page-1)" :disabled="page===1">上一页</button>
        <template x-for="p in pageRange" :key="p">
            <button class="btn btn-xs" :class="p === page ? 'btn-primary' : 'btn-ghost'" @click="load(p)" x-text="p"></button>
        </template>
        <button class="btn btn-ghost btn-xs" @click="load(page+1)" :disabled="page===totalPages">下一页</button>
        <button class="btn btn-ghost btn-xs" @click="load(totalPages)" :disabled="page===totalPages">末页</button>
        <span style="font-size:12px;color:var(--text-muted);margin-left:8px;" x-text="'第 '+page+'/'+totalPages+' 页'"></span>
    </div>
</div>

<script>
function historyList() {
    return {
        runs: [],
        expanded: null,
        selectedIds: [],
        search: '',
        statusFilter: '',
        projectFilter: '',
        page: 1,
        pageSize: 20,
        totalCount: 0,
        totalPages: 1,
        loading: false,

        get successCount() {
            // 这些需要全量数据，简化为页面内的统计
            return 0;
        },
        get failedCount() { return 0; },
        get avgDuration() {
            // 简单实现：从当前页计算
            let total = 0, count = 0;
            this.runs.forEach(r => {
                if (r.finished_at && r.created_at) {
                    total += (new Date(r.finished_at).getTime() - new Date(r.created_at).getTime()) / 1000;
                    count++;
                }
            });
            return count > 0 ? (total / count).toFixed(1) + 's' : '0s';
        },
        get projectNames() {
            return [...new Set(this.runs.map(r => r.project_name))];
        },

        get pageRange() {
            const total = this.totalPages;
            const cur = this.page;
            let start = Math.max(1, cur - 2);
            let end = Math.min(total, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            const pages = [];
            for (let i = start; i <= end; i++) pages.push(i);
            return pages;
        },

        async load(p) {
            this.loading = true;
            if (p !== undefined) this.page = p;
            const params = new URLSearchParams();
            params.set('page', this.page);
            params.set('size', this.pageSize);
            if (this.statusFilter) params.set('status', this.statusFilter);
            if (this.projectFilter) params.set('project', this.projectFilter);
            if (this.search) params.set('q', this.search);

            try {
                const res = await fetch('/api/history?' + params.toString());
                const data = await res.json();
                this.runs = data.runs || [];
                this.totalCount = data.total || 0;
                this.page = data.page || 1;
                this.totalPages = Math.max(1, Math.ceil(this.totalCount / this.pageSize));
            } catch(e) {}
            this.loading = false;
        },

        toggle(id) { this.expanded = this.expanded === id ? null : id; },

        toggleSelect(id) {
            const idx = this.selectedIds.indexOf(id);
            if (idx >= 0) this.selectedIds.splice(idx, 1);
            else this.selectedIds.push(id);
        },

        async loadDetail(id) {
            const res = await fetch('/api/history/' + id);
            return await res.json();
        },

        async deleteSingle(id) {
            if (!confirm('确定要删除这条执行记录吗？')) return;
            await fetch('/api/history/' + id, { method: 'DELETE' });
            this.expanded = null;
            showToast('success', '记录已删除');
            await this.load();
        },

        async batchDelete() {
            if (!confirm('确定要删除选中的 ' + this.selectedIds.length + ' 条记录吗？此操作不可撤销。')) return;
            try {
                const count = this.selectedIds.length;
                await fetch('/api/history/batch', {
                    method: 'DELETE',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: this.selectedIds })
                });
                this.selectedIds = [];
                showToast('success', '已删除 ' + count + ' 条记录');
                await this.load();
            } catch(e) {}
        },

        statusLabel(s) {
            return { running: '运行中', success: '成功', failed: '失败' }[s] || s;
        },

        statusBadge(s) {
            return { success: 'badge-success', failed: 'badge-failed', running: 'badge-running' }[s] || 'badge-pending';
        },

        statusIconStyle(s) {
            return {
                success: 'background:#D1FAE5;',
                failed: 'background:#FEE2E2;',
                running: 'background:#DBEAFE;'
            }[s] || 'background:#F1F5F9;';
        },

        fmtTime(t) {
            return t ? new Date(t).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '';
        },

        calcDuration(start, end) {
            if (!start || !end) return '';
            const s = (new Date(end).getTime() - new Date(start).getTime()) / 1000;
            if (s < 60) return s.toFixed(1) + 's';
            return (s / 60).toFixed(1) + 'min';
        }
    };
}
</script>
{{end}}
