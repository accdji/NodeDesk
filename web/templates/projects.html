{{define "projectsBody"}}
<div x-data="projectList()" x-init="load()">
    <!-- Stats -->
    <div class="grid-4" style="margin-bottom:24px;">
        <div class="card stat-card">
            <div class="stat-value" x-text="projects.length" style="color:var(--primary);">0</div>
            <div class="stat-label">项目总数</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="enabledCount" style="color:var(--success);">0</div>
            <div class="stat-label">已启用</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="disabledCount" style="color:var(--text-muted);">0</div>
            <div class="stat-label">已停用</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="recentRunCount" style="color:var(--running);">0</div>
            <div class="stat-label">近24h执行次数</div>
        </div>
    </div>

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;">
            <span style="font-size:14px;color:var(--text-secondary);">
                共 <strong x-text="filteredProjects.length" style="color:var(--text);">0</strong> 个项目
            </span>
            <input x-model="search" @input="page=1" placeholder="搜索项目名称或ID..."
                   style="width:220px;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;"
                   @keydown.escape="search=''">
        </div>
        <div class="btn-group">
            <span x-show="loading" class="spinner" style="border-color:rgba(124,58,237,0.3);border-top-color:#7C3AED;margin-right:4px;"></span>
            <button class="btn btn-primary btn-sm" @click="showCreate = true">+ 新建项目</button>
            <button class="btn btn-ghost btn-sm" @click="load()" :disabled="loading">刷新</button>
        </div>
    </div>

    <!-- Create Modal -->
    <div x-show="showCreate" class="card fade-in" style="margin-bottom:24px;">
        <div class="card-header">
            <h4>新建项目</h4>
            <button class="btn btn-ghost btn-xs" @click="showCreate = false; createError = '';">&times;</button>
        </div>
        <div class="card-body">
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div style="flex:1;min-width:160px;">
                    <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">项目名称 *</label>
                    <input x-model="newProject.name" placeholder="my_project" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;">
                </div>
                <div style="flex:1;min-width:160px;">
                    <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">项目 ID</label>
                    <input x-model="newProject.project_id" placeholder="001" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;">
                </div>
                <div style="flex:1;min-width:160px;">
                    <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">工作流</label>
                    <select x-model="newProject.workflow" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;">
                        <option value="standard">standard</option>
                        <template x-for="wf in workflowNames" :key="wf">
                            <option :value="wf" x-text="wf"></option>
                        </template>
                    </select>
                </div>
                <div style="display:flex;align-items:flex-end;gap:8px;">
                    <button class="btn btn-primary" @click="createProject()">创建</button>
                </div>
            </div>
            <div x-show="createError" style="margin-top:8px;font-size:12px;color:var(--failed);" x-text="createError"></div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div x-show="deleteTarget" class="card fade-in" style="margin-bottom:24px;border-color:var(--failed);">
        <div class="card-header">
            <h4 style="color:var(--failed);">确认删除</h4>
            <button class="btn btn-ghost btn-xs" @click="deleteTarget = null">&times;</button>
        </div>
        <div class="card-body">
            <p style="margin-bottom:12px;">确定要删除项目 <strong x-text="deleteTarget"></strong> 吗？此操作不可撤销。</p>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" style="background:var(--failed);" @click="confirmDelete()">确认删除</button>
                <button class="btn btn-ghost" @click="deleteTarget = null">取消</button>
            </div>
            <div x-show="deleteError" style="margin-top:8px;font-size:12px;color:var(--failed);" x-text="deleteError"></div>
        </div>
    </div>

    <!-- Project Cards -->
    <div class="grid-3" style="margin-bottom:24px;">
        <template x-for="proj in pagedProjects" :key="proj.name">
            <div class="card fade-in" style="overflow:hidden;">
                <div style="padding:20px 20px 0;">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="width:36px;height:36px;border-radius:8px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--primary);" x-text="proj.name.charAt(0).toUpperCase()"></div>
                            <div>
                                <div style="font-weight:600;font-size:15px;" x-text="proj.name"></div>
                                <div style="font-size:12px;color:var(--text-muted);" x-text="'ID: ' + proj.project_id"></div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;">
                            <!-- Enable/Disable Toggle -->
                            <span @click="toggleEnabled(proj)" :title="proj.enabled ? '点击停用' : '点击启用'"
                                  style="cursor:pointer;font-size:20px;user-select:none;"
                                  x-text="proj.enabled ? '🔵' : '⚪'"></span>
                            <!-- Delete -->
                            <span @click="deleteTarget = proj.name" title="删除项目"
                                  style="cursor:pointer;font-size:16px;color:var(--text-muted);user-select:none;">🗑</span>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);margin-top:4px;">
                        <span>&#9776;</span>
                        <span x-text="proj.workflow"></span>
                    </div>
                    <!-- Last Run Status -->
                    <div x-show="proj.last_run" style="margin-top:8px;font-size:12px;display:flex;align-items:center;gap:6px;">
                        <span class="badge-dot" :class="proj.last_run.status"></span>
                        <span style="color:var(--text-muted);" x-text="'上次: ' + fmtTime(proj.last_run.created_at)"></span>
                        <span class="badge" :class="'badge-' + (proj.last_run.status === 'running' ? 'running' : (proj.last_run.status === 'failed' ? 'failed' : 'success'))"
                              x-text="statusLabel(proj.last_run.status)" style="font-size:11px;"></span>
                    </div>
                </div>
                <div style="padding:14px 20px 16px;display:flex;gap:8px;border-top:1px solid var(--border);margin-top:16px;background:#F8FAFC;">
                    <button class="btn btn-primary btn-sm" style="flex:1;" @click="executeProject(proj)">
                        执行
                    </button>
                    <button class="btn btn-outline btn-sm" @click="previewProject(proj)">
                        预览
                    </button>
                    <a class="btn btn-outline btn-sm" :href="'/workflow/' + proj.name">详情</a>
                </div>
            </div>
        </template>
    </div>

    <!-- Pagination -->
    <div x-show="totalPages > 1" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:24px;">
        <button class="btn btn-ghost btn-xs" @click="page=1" :disabled="page===1">首页</button>
        <button class="btn btn-ghost btn-xs" @click="page>1 && page--" :disabled="page===1">上一页</button>
        <template x-for="p in pageRange" :key="p">
            <button class="btn btn-xs" :class="p === page ? 'btn-primary' : 'btn-ghost'" @click="page=p" x-text="p"></button>
        </template>
        <button class="btn btn-ghost btn-xs" @click="page<totalPages && page++" :disabled="page===totalPages">下一页</button>
        <button class="btn btn-ghost btn-xs" @click="page=totalPages" :disabled="page===totalPages">末页</button>
        <span style="font-size:12px;color:var(--text-muted);margin-left:8px;" x-text="'第 '+page+'/'+totalPages+' 页'"></span>
    </div>

    <!-- Empty state -->
    <div x-show="filteredProjects.length === 0" class="card empty" style="display:none;">
        <div class="empty-icon">&#128196;</div>
        <p style="font-weight:500;" x-text="search ? '没有匹配的项目' : '暂无项目'"></p>
        <p x-text="search ? '尝试修改搜索关键词' : '在 projects/&lt;名称&gt;/ 下创建 pipeline.json 来添加项目'"></p>
    </div>

    <!-- Preview Result (dry run) -->
    <div x-show="sseConnected" class="card fade-in">
        <div class="card-header">
            <h4>执行计划预览</h4>
            <button class="btn btn-ghost btn-xs" @click="logs = []; sseConnected = false;">关闭</button>
        </div>
        <div class="card-body">
            <div class="log-panel" style="background:#1E293B;max-height:500px;overflow-y:auto;">
                <pre style="margin:0;white-space:pre-wrap;color:#CDD6F4;font-size:13px;" x-text="logs[0] ? logs[0].message : ''"></pre>
            </div>
        </div>
    </div>
</div>

<script>
function projectList() {
    return {
        projects: [],
        logs: [],
        loading: false,
        sseConnected: false,
        showCreate: false,
        createError: '',
        deleteTarget: null,
        deleteError: '',
        newProject: { name: '', project_id: '', workflow: 'standard' },
        search: '',
        page: 1,
        pageSize: 12,

        get enabledCount() { return this.projects.filter(p => p.enabled).length; },
        get disabledCount() { return this.projects.filter(p => !p.enabled).length; },
        get workflowCount() { return [...new Set(this.projects.map(p => p.workflow))].length; },
        get workflowNames() {
            const names = [...new Set(this.projects.map(p => p.workflow))];
            return names.length > 0 ? names : ['standard'];
        },
        get recentRunCount() {
            const now = Date.now();
            const day = 24 * 60 * 60 * 1000;
            return this.projects.filter(p => p.last_run && (now - new Date(p.last_run.created_at).getTime()) < day).length;
        },

        get filteredProjects() {
            if (!this.search) return this.projects;
            const q = this.search.toLowerCase();
            return this.projects.filter(p =>
                p.name.toLowerCase().includes(q) || p.project_id.toLowerCase().includes(q)
            );
        },

        get totalPages() {
            return Math.max(1, Math.ceil(this.filteredProjects.length / this.pageSize));
        },

        get pagedProjects() {
            const start = (this.page - 1) * this.pageSize;
            return this.filteredProjects.slice(start, start + this.pageSize);
        },

        get pageRange() {
            const total = this.totalPages;
            const cur = this.page;
            let start = Math.max(1, cur - 2);
            let end = Math.min(total, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            const pages = [];
            for (let i = start; i <= end; i++) pages.push(i);
            return pages;
        },

        async load() {
            this.loading = true;
            try {
                const res = await fetch('/api/projects');
                this.projects = await res.json();
            } catch(e) { showToast('error', '加载失败: ' + e.message); }
            this.loading = false;
        },

        async executeProject(proj) {
            const res = await fetch('/api/run/' + proj.name, { method: 'POST' });
            const data = await res.json();
            if (data.run_id) {
                window.location.href = '/run/' + proj.name + '?rid=' + data.run_id;
            }
        },

        async previewProject(proj) {
            const res = await fetch('/api/run/' + proj.name + '?dry=1', { method: 'POST' });
            const data = await res.json();
            if (data.plan) {
                this.logs = [{ _idx: 0, timestamp: '', step_name: 'PLAN', message: JSON.stringify(data.plan, null, 2) }];
                this.sseConnected = true;
            }
        },

        async createProject() {
            this.createError = '';
            if (!this.newProject.name) { this.createError = '请输入项目名称'; return; }
            try {
                const res = await fetch('/api/projects', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(this.newProject)
                });
                if (res.ok) {
                    this.showCreate = false;
                    this.newProject = { name: '', project_id: '', workflow: 'standard' };
                    showToast('success', '项目已创建');
                    await this.load();
                } else {
                    this.createError = await res.text();
                }
            } catch(e) { this.createError = e.message; }
        },

        async toggleEnabled(proj) {
            try {
                const res = await fetch('/api/projects/' + proj.name, {
                    method: 'PATCH', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ enabled: !proj.enabled })
                });
                if (res.ok) {
                    proj.enabled = !proj.enabled;
                    showToast('info', proj.enabled ? '项目已启用' : '项目已停用');
                }
            } catch(e) {}
        },

        async confirmDelete() {
            this.deleteError = '';
            try {
                const res = await fetch('/api/projects/' + this.deleteTarget, { method: 'DELETE' });
                if (res.ok) {
                    this.deleteTarget = null;
                    showToast('success', '项目已删除');
                    await this.load();
                } else {
                    this.deleteError = await res.text();
                }
            } catch(e) { this.deleteError = e.message; }
        },

        statusLabel(s) {
            return { running: '运行中', success: '成功', failed: '失败' }[s] || s;
        },

        fmtTime(t) {
            return t ? new Date(t).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
        }
    };
}
</script>
{{end}}
