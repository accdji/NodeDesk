{{define "projectsBody"}}
<div x-data="projectList()" x-init="load()">
    <!-- Stats -->
    <div class="grid-4" style="margin-bottom:24px;">
        <div class="card stat-card">
            <div class="stat-value" x-text="projects.length" style="color:var(--primary);">0</div>
            <div class="stat-label">项目总数</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="enabledCount" style="color:var(--success);">0</div>
            <div class="stat-label">已启用</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="disabledCount" style="color:var(--text-muted);">0</div>
            <div class="stat-label">已停用</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" x-text="workflowCount" style="color:var(--running);">0</div>
            <div class="stat-label">工作流类型</div>
        </div>
    </div>

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <span style="font-size:14px;color:var(--text-secondary);">
            共 <strong x-text="projects.length" style="color:var(--text);">0</strong> 个项目
        </span>
        <button class="btn btn-ghost btn-sm" @click="load()">刷新</button>
    </div>

    <!-- Project Cards -->
    <div class="grid-3" style="margin-bottom:24px;">
        <template x-for="proj in projects" :key="proj.name">
            <div class="card fade-in" style="overflow:hidden;">
                <div style="padding:20px 20px 0;">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="width:36px;height:36px;border-radius:8px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--primary);" x-text="proj.name.charAt(0).toUpperCase()"></div>
                            <div>
                                <div style="font-weight:600;font-size:15px;" x-text="proj.name"></div>
                                <div style="font-size:12px;color:var(--text-muted);" x-text="'ID: ' + proj.project_id"></div>
                            </div>
                        </div>
                        <span class="badge" :class="proj.enabled ? 'badge-success' : 'badge-pending'">
                            <span class="badge-dot" :class="proj.enabled ? 'success' : 'pending'"></span>
                            <span x-text="proj.enabled ? '启用' : '停用'"></span>
                        </span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);margin-top:4px;">
                        <span>&#9776;</span>
                        <span x-text="proj.workflow"></span>
                    </div>
                </div>
                <div style="padding:14px 20px 16px;display:flex;gap:8px;border-top:1px solid var(--border);margin-top:16px;background:#F8FAFC;">
                    <button class="btn btn-primary btn-sm" style="flex:1;"
                            hx-post="/api/run/" x-bind:hx-post="'/api/run/' + proj.name"
                            hx-target="#run-result" hx-swap="innerHTML"
                            @click="selectedProject = proj.name; $nextTick(() => { setTimeout(() => { if (!window._sseInited) { initSSE(); window._sseInited = true; } }, 300); });">
                        执行
                    </button>
                    <button class="btn btn-outline btn-sm"
                            hx-post="/api/run/" x-bind:hx-post="'/api/run/' + proj.name + '?dry=1'"
                            hx-target="#run-result" hx-swap="innerHTML">
                        预览
                    </button>
                    <a class="btn btn-outline btn-sm" :href="'/workflow/' + proj.name">详情</a>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty state -->
    <div x-show="projects.length === 0" class="card empty" style="display:none;">
        <div class="empty-icon">&#128196;</div>
        <p style="font-weight:500;">暂无项目</p>
        <p>在 projects/&lt;名称&gt;/ 下创建 pipeline.json 来添加项目</p>
    </div>

    <!-- Run Result -->
    <div id="run-result"></div>

    <!-- SSE Log Panel -->
    <div x-show="sseConnected" class="card fade-in" x-init="initSSE()">
        <div class="card-header">
            <h4 style="display:flex;align-items:center;gap:8px;">
                <span class="spinner" x-show="running"></span>
                <span x-text="running ? '实时日志' : '执行完成'"></span>
            </h4>
            <div style="display:flex;align-items:center;gap:8px;">
                <span class="badge" :class="running ? 'badge-running' : 'badge-success'" x-text="running ? '执行中' : '已完成'"></span>
                <button class="btn btn-ghost btn-xs" @click="logs = []; sseConnected = false;">关闭</button>
            </div>
        </div>
        <div class="card-body" style="padding:0;">
            <div class="log-panel" id="log-output" x-ref="logPanel" style="border-radius:0;max-height:360px;">
                <template x-for="log in logs" :key="log._idx">
                    <div>
                        <span class="log-time" x-text="log.timestamp"></span>
                        <span class="log-step" style="margin-left:8px;" x-text="'[' + log.step_name + ']'"></span>
                        <span class="log-msg" style="margin-left:8px;" x-text="log.message"></span>
                    </div>
                </template>
                <div x-show="logs.length === 0" style="color:var(--text-muted);">等待日志输出...</div>
            </div>
        </div>
    </div>
</div>

<script>
function projectList() {
    return {
        projects: [],
        logs: [],
        selectedProject: '',
        es: null,
        sseConnected: false,
        running: false,
        _logIdx: 0,

        get enabledCount() { return this.projects.filter(p => p.enabled).length; },
        get disabledCount() { return this.projects.filter(p => !p.enabled).length; },
        get workflowCount() { return [...new Set(this.projects.map(p => p.workflow))].length; },

        async load() {
            const res = await fetch('/api/projects');
            this.projects = await res.json();
        },

        initSSE() {
            document.body.addEventListener('htmx:afterRequest', (evt) => {
                if (evt.detail.pathInfo && evt.detail.pathInfo.requestPath.startsWith('/api/run/')) {
                    try {
                        const resp = JSON.parse(evt.detail.xhr.responseText);
                        if (resp.run_id && !resp.dry_run) {
                            this.logs = [];
                            this._logIdx = 0;
                            this.running = true;
                            this.sseConnected = true;
                            this.connectSSE(resp.run_id);
                        }
                        if (resp.plan) {
                            this.logs = [{ _idx: 0, timestamp: '', step_name: 'PLAN', message: JSON.stringify(resp.plan, null, 2) }];
                            this.sseConnected = true;
                            this.running = false;
                        }
                    } catch(e) {}
                }
            });
        },

        connectSSE(runId) {
            if (this.es) { this.es.close(); }
            this.es = new EventSource('/api/sse/' + runId);
            this.es.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.type === 'log') {
                    msg._idx = this._logIdx++;
                    this.logs.push(msg);
                    this.$nextTick(() => {
                        const panel = this.$refs.logPanel;
                        if (panel) panel.scrollTop = panel.scrollHeight;
                    });
                } else if (msg.type === 'completed') {
                    this.running = false;
                    setTimeout(() => this.load(), 500);
                }
            };
            this.es.onerror = () => { this.sseConnected = false; this.running = false; };
        }
    };
}
</script>
{{end}}
