{{define "workflowBody"}}
<div x-data="workflowDetail('{{.Project}}')" x-init="load()">
    <!-- Breadcrumb -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;">
        <a href="/projects" style="color:var(--text-muted);text-decoration:none;">项目列表</a>
        <span style="color:var(--text-muted);">/</span>
        <span style="font-weight:500;" x-text="projectName"></span>
    </div>

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:16px;">
            <div style="width:44px;height:44px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--primary);" x-text="projectName.charAt(0).toUpperCase()"></div>
            <div>
                <div style="font-weight:700;font-size:18px;" x-text="projectName"></div>
                <div style="font-size:12px;color:var(--text-muted);">工作流详情</div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" @click="run(false)">
                <span>&#9654;</span> 执行
            </button>
            <button class="btn btn-outline" @click="run(true)">预览计划</button>
        </div>
    </div>

    <!-- Progress bar -->
    <div x-show="running || steps.length > 0" style="margin-bottom:20px;display:none;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;">
            <span style="color:var(--text-secondary);">执行进度</span>
            <span style="color:var(--text-muted);" x-text="okCount + '/' + steps.length"></span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" :class="failedCount > 0 ? 'failed' : 'success'" :style="{ width: progressPct + '%' }"></div>
        </div>
    </div>

    <div class="grid-2">
        <!-- DAG Visualization -->
        <div class="card" style="grid-row:span 2;" x-show="dagNodes.length > 0">
            <div class="card-header">
                <h4>DAG 依赖图</h4>
                <div style="display:flex;gap:12px;font-size:11px;color:var(--text-muted);">
                    <span><span class="badge-dot success" style="display:inline-block;"></span> 成功</span>
                    <span><span class="badge-dot failed" style="display:inline-block;"></span> 失败</span>
                    <span><span class="badge-dot running" style="display:inline-block;"></span> 执行中</span>
                    <span><span class="badge-dot pending" style="display:inline-block;"></span> 等待</span>
                </div>
            </div>
            <div class="card-body">
                <div id="dag-container" class="dag-container" style="min-height:320px;"></div>
            </div>
        </div>

        <!-- Empty DAG state -->
        <div class="card" x-show="dagNodes.length === 0 && !loaded" style="grid-row:span 2;">
            <div class="card-body empty">
                <div class="empty-icon">&#9679;</div>
                <p style="font-weight:500;">工作流未配置</p>
                <p>请在 projects/&lt;名称&gt;/pipeline.json 中配置 workflow 和 steps</p>
            </div>
        </div>

        <!-- Step Status -->
        <div class="card" x-show="steps.length > 0">
            <div class="card-header"><h4>步骤列表</h4></div>
            <div class="card-body" style="padding:0;">
                <div class="step-list">
                    <template x-for="s in steps" :key="s.step_name">
                        <div class="step-item">
                            <div class="step-icon" :class="s.state">
                                <span x-show="s.state === 'success'">&#10003;</span>
                                <span x-show="s.state === 'failed'">&#10007;</span>
                                <span x-show="s.state === 'running'">&#9679;</span>
                                <span x-show="s.state === 'pending' || s.state === ''">&#9679;</span>
                                <span x-show="s.state === 'skipped'">&#9654;</span>
                            </div>
                            <div class="step-info">
                                <div class="step-name" x-text="s.step_name"></div>
                                <div class="step-target">
                                    target: <span x-text="s.target || 'local'"></span>
                                    <span x-show="s.duration"> &middot; </span>
                                    <span x-show="s.duration" x-text="(s.duration || 0).toFixed(1) + 's'"></span>
                                </div>
                            </div>
                            <span class="badge" :class="statusBadge(s.state)" x-text="statusLabel(s.state)"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Step preview (before execution) -->
        <div class="card" x-show="steps.length === 0 && dagNodes.length > 0">
            <div class="card-header"><h4>工作流步骤</h4></div>
            <div class="card-body" style="padding:0;">
                <div class="step-list">
                    <template x-for="node in dagNodes" :key="node.id">
                        <div class="step-item">
                            <div class="step-icon pending">&#9679;</div>
                            <div class="step-info">
                                <div class="step-name" x-text="node.label || node.id"></div>
                                <div class="step-target">
                                    <span x-show="node.deps && node.deps.length > 0" x-text="'依赖: ' + (node.deps || []).join(', ')"></span>
                                    <span x-show="!node.deps || node.deps.length === 0">无依赖（入口步骤）</span>
                                </div>
                            </div>
                            <span class="badge badge-pending">等待执行</span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- Log Panel -->
    <div class="card" x-show="logs.length > 0">
        <div class="card-header">
            <h4>执行日志</h4>
            <span style="font-size:12px;color:var(--text-muted);" x-text="logs.length + ' 行'"></span>
        </div>
        <div class="card-body" style="padding:0;">
            <div class="log-panel" x-ref="logPanel" style="border-radius:0;max-height:400px;">
                <template x-for="log in logs" :key="log._idx">
                    <div>
                        <span class="log-time" x-text="log.timestamp"></span>
                        <span class="log-step" style="margin-left:8px;" x-text="'[' + log.step_name + ']'"></span>
                        <span class="log-msg" style="margin-left:8px;" x-text="log.message"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Plan preview (dry run) -->
    <div class="card" x-show="logs.length > 0 && running === false && steps.length === 0">
        <div class="card-header"><h4>执行计划</h4></div>
        <div class="card-body">
            <div class="log-panel" style="background:#1E293B;">
                <pre style="margin:0;white-space:pre-wrap;color:#CDD6F4;" x-text="logs[0] ? logs[0].message : ''"></pre>
            </div>
        </div>
    </div>
</div>

<script>
function workflowDetail(projectName) {
    return {
        projectName: projectName,
        steps: [],
        logs: [],
        dagNodes: [],
        dagEdges: [],
        es: null,
        running: false,
        loaded: false,
        progressPct: 0,
        okCount: 0,
        failedCount: 0,
        _logIdx: 0,

        async load() {
            const pluginsRes = await fetch('/api/plugins');
            const plugins = await pluginsRes.json();
            this.dagNodes = plugins.map(p => ({
                id: p.name,
                label: p.label || p.name,
                status: 'pending',
                deps: p.depends_on || []
            }));
            plugins.forEach(p => {
                (p.depends_on || []).forEach(dep => {
                    if (this.dagEdges.findIndex(e => e.from === dep && e.to === p.name) === -1) {
                        this.dagEdges.push({ from: dep, to: p.name });
                    }
                });
            });
            this.loaded = this.dagNodes.length > 0;
            if (this.dagNodes.length > 0) {
                this.$nextTick(() => this.drawDAG());
            }
        },

        async run(dryRun) {
            const url = '/api/run/' + this.projectName + (dryRun ? '?dry=1' : '');
            const res = await fetch(url, { method: 'POST' });
            const data = await res.json();

            if (data.plan) {
                this.logs = [{ _idx: 0, timestamp: '', step_name: 'PLAN', message: JSON.stringify(data.plan, null, 2) }];
                this.steps = [];
                return;
            }

            if (data.run_id) {
                this.logs = [];
                this.steps = [];
                this._logIdx = 0;
                this.running = true;
                this.okCount = 0;
                this.failedCount = 0;
                this.progressPct = 0;
                this.connectSSE(data.run_id);
            }
        },

        connectSSE(runId) {
            if (this.es) { this.es.close(); }
            this.es = new EventSource('/api/sse/' + runId);

            this.es.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.type === 'log') {
                    msg._idx = this._logIdx++;
                    this.logs.push(msg);
                    this.$nextTick(() => {
                        const panel = this.$refs.logPanel;
                        if (panel) panel.scrollTop = panel.scrollHeight;
                    });
                    const node = this.dagNodes.find(n => n.id === msg.step_name);
                    if (node) {
                        if (msg.message.includes('开始执行')) node.status = 'running';
                        else if (msg.message.includes('完成')) node.status = 'success';
                        else if (msg.message.includes('失败')) node.status = 'failed';
                        else if (msg.message.includes('跳过')) node.status = 'skipped';
                    }
                    this.$nextTick(() => this.drawDAG());
                } else if (msg.type === 'completed') {
                    this.running = false;
                    this.loadHistory(runId);
                }
            };

            this.es.onerror = () => { this.running = false; };
        },

        async loadHistory(runId) {
            const res = await fetch('/api/history/' + runId);
            const data = await res.json();
            if (data.steps) {
                this.steps = data.steps;
                this.okCount = data.steps.filter(s => s.state === 'success').length;
                this.failedCount = data.steps.filter(s => s.state === 'failed').length;
                this.progressPct = data.steps.length > 0 ? Math.round(this.okCount / data.steps.length * 100) : 0;
                data.steps.forEach(s => {
                    const node = this.dagNodes.find(n => n.id === s.step_name);
                    if (node) node.status = s.state;
                });
                this.$nextTick(() => this.drawDAG());
            }
        },

        statusLabel(state) {
            return { pending: '等待', running: '运行中', success: '成功', failed: '失败', skipped: '已跳过' }[state] || state;
        },

        statusBadge(state) {
            return 'badge-' + ({ success: 'success', failed: 'failed', running: 'running', skipped: 'skipped', pending: 'pending' }[state] || 'pending');
        },

        drawDAG() {
            const container = document.getElementById('dag-container');
            if (!container || this.dagNodes.length === 0) return;
            container.innerHTML = '';
            const width = Math.max(container.clientWidth || 700, 500);
            const height = 340;

            const svg = d3.select('#dag-container').append('svg')
                .attr('width', width).attr('height', height);

            const levels = this.computeLevels();
            const levelWidth = width / (levels.length + 1);
            const colorMap = { success: '#10B981', failed: '#EF4444', running: '#3B82F6', skipped: '#F59E0B', pending: '#94A3B8' };

            const nodes = this.dagNodes.map((n) => {
                const level = levels.findIndex(l => l.includes(n.id));
                const itemsInLevel = (levels[level] || []).length || 1;
                const idxInLevel = (levels[level] || []).indexOf(n.id);
                return {
                    ...n,
                    x: (level + 1) * levelWidth - 70,
                    y: (idxInLevel + 0.5) * (height / Math.max(itemsInLevel, 1))
                };
            });

            // Arrow marker
            svg.append('defs').append('marker')
                .attr('id', 'arrowhead').attr('viewBox', '0 0 10 10')
                .attr('refX', 20).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
                .attr('orient', 'auto')
                .append('path').attr('d', 'M0,0 L10,5 L0,10 Z').attr('fill', '#CBD5E1');

            // Drop shadow
            const filter = svg.append('defs').append('filter').attr('id', 'shadow');
            filter.append('feDropShadow').attr('dx', 0).attr('dy', 2).attr('stdDeviation', 3).attr('flood-opacity', 0.2);

            // Edges
            const nodeMap = {};
            nodes.forEach(n => { nodeMap[n.id] = n; });

            svg.selectAll('line').data(this.dagEdges).enter().append('line')
                .attr('x1', d => (nodeMap[d.from] || {x:0}).x + 70)
                .attr('y1', d => (nodeMap[d.from] || {y:0}).y)
                .attr('x2', d => (nodeMap[d.to] || {x:0}).x)
                .attr('y2', d => (nodeMap[d.to] || {y:0}).y)
                .attr('stroke', '#CBD5E1').attr('stroke-width', 2)
                .attr('marker-end', 'url(#arrowhead)');

            // Nodes
            const g = svg.selectAll('g.node').data(nodes).enter().append('g')
                .attr('transform', d => `translate(${d.x},${d.y - 22})`);

            g.append('rect')
                .attr('width', 140).attr('height', 44)
                .attr('rx', 10)
                .attr('fill', d => colorMap[d.status] || '#94A3B8')
                .attr('filter', 'url(#shadow)');

            g.append('text')
                .attr('x', 70).attr('y', 27)
                .attr('text-anchor', 'middle').attr('fill', '#fff')
                .attr('font-size', 13).attr('font-weight', 600)
                .text(d => d.label);
        },

        computeLevels() {
            if (this.dagNodes.length === 0) return [];
            let levels = [];
            let placed = new Set();
            const allIds = this.dagNodes.map(n => n.id);

            while (placed.size < allIds.length) {
                let current = [];
                allIds.forEach(id => {
                    if (placed.has(id)) return;
                    const deps = this.dagEdges.filter(e => e.to === id).map(e => e.from);
                    if (deps.every(d => placed.has(d))) {
                        current.push(id);
                    }
                });
                if (current.length === 0) {
                    allIds.forEach(id => { if (!placed.has(id)) { current.push(id); placed.add(id); } });
                } else {
                    current.forEach(id => placed.add(id));
                }
                if (current.length > 0) levels.push(current);
            }
            return levels;
        }
    };
}
</script>
{{end}}
