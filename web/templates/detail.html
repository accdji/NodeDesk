{{define "detailBody"}}
<div x-data="runDetail('{{.RunID}}')" x-init="load()">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;">
        <a href="/history" style="color:var(--text-muted);text-decoration:none;">执行历史</a>
        <span style="color:var(--text-muted);">/</span>
        <span style="font-weight:500;" x-text="runId"></span>
    </div>

    <div x-show="loading" style="text-align:center;padding:60px;color:var(--text-muted);">
        <span class="spinner"></span> 加载中...
    </div>

    <!-- Run Summary -->
    <div x-show="!loading && detail" class="card fade-in" style="margin-bottom:24px;">
        <div class="card-header">
            <h4>执行概要</h4>
            <span class="badge" :class="statusBadge(detail.run.status)" x-text="statusLabel(detail.run.status)"></span>
        </div>
        <div class="card-body">
            <div class="grid-4">
                <div class="stat-card">
                    <div class="stat-value" style="font-size:16px;" x-text="detail.run.project_name"></div>
                    <div class="stat-label">项目</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="font-size:16px;" x-text="detail.run.workflow_name"></div>
                    <div class="stat-label">工作流</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="font-size:16px;" x-text="fmtTime(detail.run.created_at)"></div>
                    <div class="stat-label">开始时间</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="font-size:16px;" x-text="duration"></div>
                    <div class="stat-label">总耗时</div>
                </div>
            </div>
            <div style="margin-top:8px;font-size:12px;color:var(--text-muted);" x-text="'Run ID: ' + runId"></div>
        </div>
    </div>

    <!-- Step Results -->
    <div x-show="!loading && detail && detail.steps && detail.steps.length > 0" class="card" style="margin-bottom:24px;">
        <div class="card-header"><h4>步骤结果</h4></div>
        <div class="card-body" style="padding:0;">
            <div class="step-list">
                <template x-for="s in detail.steps" :key="s.step_name">
                    <div>
                        <div class="step-item" style="cursor:pointer;" @click="s._open = !s._open">
                            <div class="step-icon" :class="s.state">
                                <span x-show="s.state === 'success'">&#10003;</span>
                                <span x-show="s.state === 'failed'">&#10007;</span>
                                <span x-show="s.state === 'running'">&#9679;</span>
                                <span x-show="s.state === 'skipped'">&#9654;</span>
                                <span x-show="!s.state">&#9679;</span>
                            </div>
                            <div class="step-info" style="flex:1;">
                                <div class="step-name" x-text="s.step_name"></div>
                                <div class="step-target" x-text="(s.target||'local') + ' · ' + (s.duration||0).toFixed(1)+'s'"></div>
                            </div>
                            <span class="badge" :class="'badge-' + s.state" x-text="s.state"></span>
                            <span x-show="s.error" style="color:var(--failed);font-size:20px;" title="有错误">&#9888;</span>
                        </div>
                        <div x-show="s._open" style="padding:8px 16px 12px 52px;background:#F8FAFC;border-top:1px solid var(--border);">
                            <div x-show="s.error" style="margin-bottom:8px;padding:8px 12px;background:#FEE2E2;border-radius:6px;font-size:13px;color:#DC2626;">
                                <strong>错误:</strong> <span x-text="s.error"></span>
                            </div>
                            <div x-show="s.data" style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">输出数据:</div>
                            <pre x-show="s.data" style="background:#1E293B;color:#CDD6F4;padding:10px 12px;border-radius:6px;font-size:12px;max-height:200px;overflow:auto;margin:0;" x-text="s.data"></pre>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Timing Chart -->
    <div x-show="!loading && detail && detail.steps && detail.steps.length > 0" class="card" style="margin-bottom:24px;">
        <div class="card-header"><h4>耗时分布</h4></div>
        <div class="card-body">
            <template x-for="s in detail.steps" :key="'t-' + s.step_name">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                    <span style="width:100px;font-size:13px;text-align:right;flex-shrink:0;" x-text="s.step_name"></span>
                    <div style="flex:1;background:var(--bg);border-radius:4px;height:20px;position:relative;overflow:hidden;">
                        <div :style="{ width: timingPct(s), background: s.state === 'failed' ? 'var(--failed)' : 'var(--primary)', height:'100%', borderRadius:'4px', transition:'width 0.3s' }"></div>
                    </div>
                    <span style="width:50px;font-size:12px;color:var(--text-muted);flex-shrink:0;" x-text="(s.duration||0).toFixed(1)+'s'"></span>
                </div>
            </template>
        </div>
    </div>

    <!-- Logs -->
    <div x-show="!loading && detail && detail.logs && detail.logs.length > 0" class="card" style="margin-bottom:24px;">
        <div class="card-header">
            <h4>执行日志</h4>
            <div style="display:flex;align-items:center;gap:8px;">
                <input x-model="logSearch" placeholder="搜索日志..." style="width:200px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;">
                <span style="font-size:12px;color:var(--text-muted);" x-text="detail.logs.length + ' 行'"></span>
            </div>
        </div>
        <div class="card-body" style="padding:0;">
            <div class="log-panel" style="border-radius:0;max-height:500px;overflow-y:auto;">
                <template x-for="log in filteredLogs" :key="log.timestamp + log.message">
                    <div>
                        <span class="log-time" x-text="log.timestamp"></span>
                        <span class="log-step" style="margin-left:8px;" x-text="'[' + log.step_name + ']'"></span>
                        <span class="log-msg" style="margin-left:8px;" x-html="highlight(log.message)"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div x-show="!loading && detail" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" @click="rerun(false)">重新执行</button>
        <button class="btn btn-outline" @click="rerun(true)" x-show="detail.run.status === 'failed'">重跑失败步骤</button>
        <a :href="'/workflow/' + detail.run.project_name" class="btn btn-ghost">编辑工作流</a>
        <a :href="'/api/history/' + runId + '/logs/download'" class="btn btn-ghost">下载日志</a>
    </div>
</div>

<script>
function runDetail(runId) {
    return {
        runId: runId,
        detail: null,
        loading: true,
        logSearch: '',

        get filteredLogs() {
            if (!this.detail || !this.detail.logs) return [];
            if (!this.logSearch) return this.detail.logs;
            const q = this.logSearch.toLowerCase();
            return this.detail.logs.filter(l => l.message.toLowerCase().includes(q));
        },

        get duration() {
            if (!this.detail) return '';
            const d = this.detail.run;
            if (!d.created_at) return '';
            const end = d.finished_at ? new Date(d.finished_at) : new Date();
            const s = (end.getTime() - new Date(d.created_at).getTime()) / 1000;
            return s < 60 ? s.toFixed(1) + 's' : (s / 60).toFixed(1) + 'min';
        },

        async load() {
            try {
                const res = await fetch('/api/history/' + this.runId);
                this.detail = await res.json();
            } catch(e) {}
            this.loading = false;
        },

        async rerun(fromStep) {
            if (!this.detail) return;
            const proj = this.detail.run.project_name;
            const url = '/api/run/' + proj + (fromStep ? '?from=' + this.getFailedStep() : '');
            const res = await fetch(url, { method: 'POST' });
            const data = await res.json();
            if (data.run_id) {
                window.location.href = '/run/' + proj + '?rid=' + data.run_id;
            }
        },

        getFailedStep() {
            if (!this.detail || !this.detail.steps) return '';
            const failed = this.detail.steps.find(s => s.state === 'failed');
            return failed ? failed.step_name : '';
        },

        timingPct(s) {
            if (!this.detail || !this.detail.steps) return '0%';
            const max = Math.max(...this.detail.steps.map(s => s.duration || 0), 0.1);
            return ((s.duration || 0) / max * 100).toFixed(0) + '%';
        },

        highlight(msg) {
            if (!this.logSearch) return msg;
            const re = new RegExp('(' + this.logSearch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            return msg.replace(re, '<mark style="background:#FDE68A;color:#1E293B;padding:0 2px;">$1</mark>');
        },

        statusLabel(s) {
            return { running: '运行中', success: '成功', failed: '失败' }[s] || s;
        },

        statusBadge(s) {
            return { success: 'badge-success', failed: 'badge-failed', running: 'badge-running' }[s] || 'badge-pending';
        },

        fmtTime(t) {
            return t ? new Date(t).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '';
        }
    };
}
</script>
{{end}}
